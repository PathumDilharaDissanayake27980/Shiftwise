# Sends ShiftWise alerts to your phone. Setup: docs/PHONE_ALERTS.md
# Secrets: ALERTS_KEY, plus at least one channel:
#   NTFY_TOPIC (recommended, free ntfy app)  ·  TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID  ·  CALLMEBOT_PHONE + CALLMEBOT_APIKEY
# With no channel set up the run ends quietly instead of failing.
name: Phone alerts

on:
  schedule:
    # Every 10 minutes. GitHub may start scheduled runs several minutes late at busy times.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test message instead of the schedule'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: phone-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send due alerts
        run: node scripts/send-alerts.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ALERTS_KEY: ${{ secrets.ALERTS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEND_TEST: ${{ inputs.test }}
